name: build

on:
  push:
    branches: ["**"]
    tags: ["*"]
    paths-ignore:
      - "Tests/**"
      - "GomuksUITests/**"
      - ".github/workflows/ui-test.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Gomuks.xcodeproj -scheme Gomuks -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Gomuks.app Payload/
          zip -qr gomuks.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: gomuks-ipa
          path: gomuks.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gomuks.ipa --title "$GITHUB_REF_NAME" --generate-notes
