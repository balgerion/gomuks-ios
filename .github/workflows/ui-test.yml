name: ui-test

on:
  workflow_dispatch:
  push:
    paths:
      - GomuksUITests/**
      - Tests/testbed/**
      - .github/workflows/ui-test.yml

env:
  GOMUKS_REF: 90ccd9323d104d72df4ccab078cc56df866accba

jobs:
  ui-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gomuks/gomuks
          ref: ${{ env.GOMUKS_REF }}
          path: gomuks-src

      - uses: actions/cache/restore@v4
        id: gomuks-bin
        with:
          path: gomuks-src/gomuks
          key: gomuks-bin-macos-${{ env.GOMUKS_REF }}

      - uses: actions/cache/restore@v4
        id: synapse-venv
        with:
          path: Tests/testbed/state/venv
          key: synapse-venv-macos-py3.12-v1

      - uses: actions/setup-go@v5
        if: steps.gomuks-bin.outputs.cache-hit != 'true'
        with:
          go-version-file: gomuks-src/go.mod
          cache-dependency-path: gomuks-src/go.sum

      - uses: actions/setup-node@v4
        if: steps.gomuks-bin.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start test backend
        env:
          GOMUKS_SRC: ${{ github.workspace }}/gomuks-src
        run: Tests/testbed/setup.sh

      - uses: actions/cache/save@v4
        if: steps.gomuks-bin.outputs.cache-hit != 'true'
        with:
          path: gomuks-src/gomuks
          key: gomuks-bin-macos-${{ env.GOMUKS_REF }}

      - uses: actions/cache/save@v4
        if: steps.synapse-venv.outputs.cache-hit != 'true'
        with:
          path: Tests/testbed/state/venv
          key: synapse-venv-macos-py3.12-v1

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Run UI tests
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          device=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 16( Pro)? \(' | sed 's/ ($//')
          xcodebuild test -project Gomuks.xcodeproj -scheme Gomuks \
            -destination "platform=iOS Simulator,name=$device" \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO > build-test.log 2>&1 || status=$?
          grep -E "PERF|GEOMETRY|error:|Test Case|Executed" build-test.log || true
          sed -n '/TREE-BEGIN/,/TREE-END/p' build-test.log | head -300
          if [ -n "${status:-}" ]; then tail -n 60 Tests/testbed/state/gomuks/logs/gomuks.log || true; fi
          exit ${status:-0}

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/attachments
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/attachments || true
          cp -R Tests/testbed/state/logs build/attachments/backend-logs || true
          cp build-test.log build/attachments/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: build/attachments
