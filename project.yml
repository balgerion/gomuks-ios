name: Gomuks
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Gomuks:
    type: application
    platform: iOS
    sources:
      - Gomuks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balgeriada.gomuks
        INFOPLIST_FILE: Gomuks/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - GomuksUITests
  GomuksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GomuksUITests
    dependencies:
      - target: Gomuks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balgeriada.gomuks.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
